name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Show buildozer.spec (verify no warnings)
        run: |
          echo "===== buildozer.spec content ====="
          cat buildozer.spec
          echo "=================================="

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip \
            openjdk-17-jdk libltdl-dev autoconf automake \
            libtool libffi-dev zlib1g-dev libssl-dev

      - name: Set Java environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Install Android SDK (non‑interactive, fully licensed)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT

          # Save for future steps
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          # Download cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip -d android-sdk-tmp
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          mv android-sdk-tmp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

          # Create license directory and accept all licenses manually
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e" \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-license

          # Now install required packages (using --sdk_root)
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "platform-tools"

      - name: Debug – show installed SDK contents
        run: |
          echo "=== SDK directory structure ==="
          ls -R $ANDROID_SDK_ROOT || true
          echo "=== Checking aidl ==="
          ls -la $ANDROID_SDK_ROOT/build-tools/33.0.2/aidl

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          yes | buildozer android debug 2>&1 | cat

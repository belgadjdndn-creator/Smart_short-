name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip \
            openjdk-17-jdk libltdl-dev autoconf automake \
            libtool libffi-dev zlib1g-dev libssl-dev

      - name: Set Java environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Force-correct buildozer.spec (remove deprecated tokens & fix Python)
        run: |
          # Remove any deprecated "android.arch" (but not "android.archs")
          sed -i '/^android\.arch[^s]/d' buildozer.spec

          # Remove deprecated "android.sdk" token if present
          sed -i '/^android\.sdk\s*=/d' buildozer.spec

          # Ensure android.archs is present
          if ! grep -q '^android\.archs\s*=' buildozer.spec; then
            echo "android.archs = armeabi-v7a, arm64-v8a" >> buildozer.spec
          fi

          # Ensure license acceptance is set
          if ! grep -q '^android\.accept_sdk_license\s*=' buildozer.spec; then
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          # Replace python3==X.X.X with python3 (exact pinning not supported)
          sed -i '/^requirements\s*=/ s/python3==[0-9.]*/python3/' buildozer.spec

          # Force Python 3.8 recipe
          if ! grep -q '^android\.python_version\s*=' buildozer.spec; then
            echo "android.python_version = 3.8" >> buildozer.spec
          fi

          echo "=== Sanitised buildozer.spec ==="
          cat buildozer.spec

      - name: Prepare Android SDK license (fully non‑interactive)
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          mkdir -p $ANDROID_SDK_ROOT/licenses
          # The exact license hash accepted by all recent Android SDK tools
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-license

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK (debug)
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk

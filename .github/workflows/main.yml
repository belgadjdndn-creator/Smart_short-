name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer Cython==0.29.33 virtualenv

    - name: Accept Android Licenses Automatically
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # تحميل أداة الـ sdkmanager للموافقة على الرخص مسبقاً
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O commandlinetools.zip
        unzip commandlinetools.zip -d cmdline-tools
        mkdir -p sdk/cmdline-tools/latest
        mv cmdline-tools/cmdline-tools/* sdk/cmdline-tools/latest/
        export ANDROID_HOME=$PWD/sdk
        yes | sdk/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Build with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: smart-shorts-apk
        path: bin/*.apk

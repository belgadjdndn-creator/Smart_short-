name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip \
            openjdk-17-jdk libltdl-dev autoconf automake \
            libtool libffi-dev zlib1g-dev libssl-dev

      - name: Set Java environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Force-correct buildozer.spec (clean deprecated tokens, fix Python, block SDK auto-download)
        run: |
          # 1. Remove deprecated android.arch (but keep android.archs)
          sed -i '/^android\.arch[^s]/d' buildozer.spec

          # 2. Remove deprecated android.sdk = ... line
          sed -i '/^android\.sdk\s*=/d' buildozer.spec

          # 3. Ensure android.archs exists
          if ! grep -q '^android\.archs\s*=' buildozer.spec; then
            echo "android.archs = armeabi-v7a, arm64-v8a" >> buildozer.spec
          fi

          # 4. Ensure license acceptance
          if ! grep -q '^android\.accept_sdk_license\s*=' buildozer.spec; then
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          # 5. Replace python3==X.X.X with python3 (exact pinning not supported)
          sed -i '/^requirements\s*=/ s/python3==[0-9.]*/python3/' buildozer.spec

          # 6. Force Python 3.8
          if ! grep -q '^android\.python_version\s*=' buildozer.spec; then
            echo "android.python_version = 3.8" >> buildozer.spec
          fi

          # 7. Ensure custom SDK path is set
          if ! grep -q '^android\.sdk_path\s*=' buildozer.spec; then
            echo "android.sdk_path = /home/runner/android-sdk" >> buildozer.spec
          fi

          # 8. CRITICAL: Prevent Buildozer from downloading its own SDK
          if ! grep -q '^android\.sdk_update\s*=' buildozer.spec; then
            echo "android.sdk_update = False" >> buildozer.spec
          fi

          echo "=== Sanitised buildozer.spec ==="
          cat buildozer.spec

      - name: Setup Android SDK (fully licensed + legacy symlink for Buildozer)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/licenses

          # Write the licence file – guarantees 0 prompts
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-license

          # Download cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip -d cmdline-tools-tmp
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          mv cmdline-tools-tmp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

          # Accept every license with yes
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT --licenses

          # Pre‑install the exact build tools we need
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;33.0.2" "platforms;android-33" "platform-tools"

          # *** CRITICAL FIX ***
          # Buildozer expects a legacy "tools" directory; symlink it to cmdline-tools
          ln -s $ANDROID_SDK_ROOT/cmdline-tools/latest $ANDROID_SDK_ROOT/tools

          # Export variables so Buildozer finds our SDK
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Verify aidl is truly present
          ls -la $ANDROID_SDK_ROOT/build-tools/33.0.2/aidl

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK (debug)
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk

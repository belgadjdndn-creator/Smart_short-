name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip \
            openjdk-17-jdk libltdl-dev autoconf automake \
            libtool libffi-dev zlib1g-dev libssl-dev

      - name: Set Java environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Setup Android SDK (non‑interactive license accept)
        run: |
          # Download command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip -d android-sdk

          # Create the correct directory layout
          mkdir -p $HOME/android-sdk/cmdline-tools
          mv android-sdk/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          # Export SDK root for current and subsequent steps
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

          # Accept all licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

          # Install the exact build-tools and platform we need (match spec)
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;33.0.2" \
            "platforms;android-33"

      - name: Verify SDK installation (aidl must exist)
        run: |
          ls -la $ANDROID_SDK_ROOT/build-tools/33.0.2/aidl && echo "aidl found" || exit 1

      - name: Install Buildozer and build dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

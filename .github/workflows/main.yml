name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-pip \
            openjdk-17-jdk libltdl-dev autoconf automake \
            libtool libffi-dev zlib1g-dev libssl-dev

      - name: Set Java environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Generate a clean buildozer.spec (ignore repo spec)
        run: |
          cat > buildozer.spec << 'SPECEOF'
          [app]
          title = Smart Shorts
          package.name = smartshorts
          package.domain = org.example
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy==2.2.1,requests,certifi,urllib3,android,yt_dlp,websockets,mutagen,pycryptodomex
          orientation = portrait
          fullscreen = 1

          android.sdk_path = /home/runner/android-sdk
          android.accept_sdk_license = True
          android.sdk_update = False

          android.api = 33
          android.minapi = 21
          android.build_tools_version = 33.0.2

          android.archs = armeabi-v7a, arm64-v8a
          android.ndk_version = 25b
          android.javac_source = 17
          android.javac_target = 17
          android.python_version = 3.8

          android.keystore = debug.keystore
          android.gradle_dependencies = 
          android.add_src = 
          log_level = 2

          [buildozer]
          SPECEOF
          echo "=== Fresh buildozer.spec ==="
          cat buildozer.spec

      - name: Setup Android SDK & accept all licenses (for both custom and internal paths)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/licenses

          # License hash
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-license

          # ---- Install cmdline-tools into custom SDK ----
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip -d cmdline-tools-tmp
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          mv cmdline-tools-tmp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

          # Accept all licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT --licenses

          # Pre-install both build-tools 33.0.2 (our spec) AND 37.0.0 (what Buildozer sometimes requests)
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_SDK_ROOT \
            "build-tools;33.0.2" \
            "build-tools;37.0.0" \
            "platforms;android-33" \
            "platform-tools"

          # Symlink tools -> cmdline-tools/latest so Buildozer sees a legacy SDK layout
          ln -s $ANDROID_SDK_ROOT/cmdline-tools/latest $ANDROID_SDK_ROOT/tools

          # ---- Also place the license file where Buildozer might look internally ----
          BUILD_DEFAULT_SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $BUILD_DEFAULT_SDK/licenses
          cp $ANDROID_SDK_ROOT/licenses/android-sdk-license $BUILD_DEFAULT_SDK/licenses/

          # Set env vars
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Verify
          ls -la $ANDROID_SDK_ROOT/build-tools/33.0.2/aidl
          ls -la $ANDROID_SDK_ROOT/build-tools/37.0.0/aidl

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK (debug)
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
